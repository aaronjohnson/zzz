name: Android Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      build_phone:
        description: 'Build phone APK'
        type: boolean
        default: true
      build_watch:
        description: 'Build watch APK'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  phone:
    if: github.event_name == 'push' || inputs.build_phone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Phone APK
        run: flutter build apk --release

      - name: Upload phone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  watch:
    if: github.event_name == 'push' || inputs.build_watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Watch APK
        run: gradle -p android :wear:assembleRelease

      - name: List outputs
        run: find . -name "*.apk" -type f 2>/dev/null

      - name: Upload watch APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: watch-apk
          path: build/wear/outputs/apk/release/wear-release-unsigned.apk

  release:
    needs: [phone, watch]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download phone APK
        if: needs.phone.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: phone-apk
          path: artifacts/phone

      - name: Download watch APK
        if: needs.watch.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: watch-apk
          path: artifacts/watch

      - name: List artifacts
        run: find artifacts -type f 2>/dev/null || echo "No artifacts"

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/phone/app-release.apk
            artifacts/watch/wear-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
